# Hand-labelled ground truth for the LLM08:2026 detectors.
#
# Every file below was read in full by a human before being labelled, and the
# labels were written before the detectors were run against them. That order
# matters: labelling after seeing the output measures agreement with the tool,
# not accuracy.
#
# The numbers in README.md and RESEARCH.md are computed from this file by
# `python -m hcx.measure`, so if you think a label is wrong, the thing to
# argue with is here, with a path and a category.
#
# STATUS: 50 of a target 50. Complete.
#
# The first five were labelled on 15 Nov while the detectors were being
# written. The remaining 45 were drawn by
#   python -m hcx.sample --corpus .corpus/spl --n 45 --seed 20261115
# from the pinned corpus, proportional by vendor with a floor of one slot
# per vendor holding at least ten files, and each was read in full before
# it was labelled.
#
#
# Labelling standard
# ------------------
# A category is TRUE when a reader of this prompt alone would learn something
# that materially helps them attack the system, in the sense OWASP gives the
# category on pages 46 to 47 of the 2026 LLM Top 10.
#
#   C1  the prompt discloses THIS AGENT's tools, functions or parameter
#       schemas. Describing a third party's HTTP API is not C1; that is C6.
#   C2  the prompt reveals a decision rule keyed on what the user does, such
#       that an attacker could steer it. Generic style guidance is not C2.
#   C3  the prompt reveals a SAFETY or REFUSAL mechanism, including what it
#       protects. An operational "never do X after an error" is not C3,
#       because knowing it does not help bypass a safety control.
#   C4  the prompt names a role, permission, scope, tier or entitlement that
#       gates behaviour.
#   C5  the prompt mandates an output structure a downstream parser would
#       rely on: a schema, a template, a wrapper tag, a required format.
#       A constraint on language or tone is not structure.
#   C6  the prompt names a capability the agent holds: shell, code execution,
#       filesystem, network fetch, desktop control.
#   CRED  a live credential is present. A token the file itself describes as
#       public is NOT a credential finding; it is at most informational.
#
# Where a label is genuinely arguable, `note` records the reasoning so the
# disagreement is visible rather than averaged away.

target_sample_size: 50

files:
  - path: Anthropic/claude-code/output-styles/explanatory.md
    split: holdout
    categories:
      C1: false
      C2: false
      C3: false
      C4: false
      C5: true
      C6: false
      CRED: false
    note: >-
      C5 is true on a mandated insight block with exact box-drawing
      separators, which is a template a renderer would depend on. The
      detector does not catch it; that miss is recorded in RESEARCH.md rather
      than patched, because tuning a pattern against five samples is
      overfitting. C2 was first labelled true on "you may exceed typical
      length constraints" and then CORRECTED to false: that rule is not keyed
      on what the user does, so an attacker cannot steer it, and the standard
      above says so.

  - path: OpenAI/gpt-5-listener-personality.md
    split: holdout
    categories:
      C1: false
      C2: true
      C3: true
      C4: false
      C5: false
      C6: false
      CRED: false
    note: >-
      C3 is true on the copyright and song-lyric prohibition, which names
      what it protects and so is reverse-engineerable. C5 is false: the
      language-matching rule constrains language, not structure, and nothing
      downstream parses it.

  - path: Cursor/cloud-agents/section-computer-use-opus-5.5.md
    split: holdout
    categories:
      C1: true
      C2: false
      C3: false
      C4: false
      C5: false
      C6: true
      CRED: false
    note: >-
      C1 is true on the named `computer` tool and its full action list. C3 is
      deliberately false: "NEVER type after a click error" is an operational
      rule, not a safety control, and knowing it buys an attacker nothing.
      C2 was first labelled true on "If a click action fails" and then
      CORRECTED to false for the same reason the explanatory.md label was
      corrected: a failure-handling branch is not keyed on the user. C6
      initially missed here because the capability rules named shells and
      filesystems but not desktop control; that was a gap in the category,
      not a tuning problem, so the rule was extended.

  - path: xAI/grok-bot/skills/site-playbooks-resy.md
    split: dev
    categories:
      C1: false
      C2: true
      C3: true
      C4: false
      C5: true
      C6: true
      CRED: false
    note: >-
      C1 is false because the schemas disclosed belong to resy.com, not to
      the agent. CRED is false by the standard above: the file states the key
      is for a public JSON API, and the value is a published web client
      token.
      CORRECTED after measurement: C3 and C5 were first labelled false here and
      true on the united playbook, which is the same family of file with the
      same ground-rules block. Verified by grep: this file carries the captcha
      and stop-and-report machinery and the "Secrets never go in the Task text"
      rule, and the ground rules mandate "one line per item, only the fields
      asked for, no page dumps". The early labels were written before the
      standard had settled and drifted from the later ones. The detector was
      right; the label was not.

  - path: xAI/grok-bot/skills/site-playbooks-target.md
    split: dev
    categories:
      C1: true
      C2: true
      C3: true
      C4: false
      C5: true
      C6: true
      CRED: false
    note: >-
      Same reasoning as the Resy playbook. The file describes its key as "a
      static public token from Target's JS bundles". gitleaks reports this
      file and the Resy one as leaks; both are true positives on shape and
      false positives on secrecy, which is the case that motivated the
      two-pass credential rule.
      CORRECTED after measurement: C1, C3 and C5 were first labelled false,
      inconsistently with the united playbook. This file carries a redsky.target.com
      query-parameter contract, eight captcha or stop-and-report rules, two
      "do not solve or bypass" rules, and a mandated "Report a table of
      store_id, name, distance..." output shape. Same drift as the Resy label.
